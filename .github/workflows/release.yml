# Stages the package when a version tag (v0.2.0) is pushed: npm version minor,
# then git push --follow-tags. npm's trusted publishing (OIDC) signs it with
# provenance; no npm token is stored. The trusted publisher may only stage: the
# version goes live when a maintainer approves it with 2FA
# (npm stage list archrift, then npm stage approve <id>), so a workflow or a
# GitHub account alone can't publish. 0.1.0 was published by hand.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - name: The tag is package.json's version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:pack
      - run: npm run build
      # npm stage arrived in npm 11.x; Node's own npm may predate it
      - run: npm install -g npm@11.19.0
      # a version already on npm (0.1.0 was published by hand) is left as it is
      - name: Stage for approval, unless this version is on npm already
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "archrift@$version" version > /dev/null 2>&1; then echo "archrift $version is on npm already"; else npm stage publish --provenance --access public; fi
