apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ .Chart.Name }}-ingress"
spec:
  rules:
  - host: {{ quote .Values.domainName }}
    http:
      paths:
      {{- range .Values.paths }}
      - path: {{ . | quote }}
        pathType: Prefix
        backend:
          service:
            name: {{ $.Chart.Name }}
            port:
              number: {{ $.Values.container.port }}
      {{- end }}
